<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 256px; height: 256px; overflow: hidden; }
  .stage { position: relative; width: 256px; height: 256px;
           background: radial-gradient(320px 220px at 70% -10%, #24466F 0%, #16294A 52%, #0F172A 100%);
           border-radius: 56px; display: grid; place-items: center; }
  .glow { position: absolute; width: 190px; height: 190px; border-radius: 50%;
          background: radial-gradient(circle, rgba(34,197,94,.22) 0%, transparent 65%); }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <svg width="150" height="122" viewBox="0 0 24 19" fill="none">
    <path d="M2.2 7.2C8 1.7 16 1.7 21.8 7.2" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
    <path d="M5.4 10.6C9.5 7 14.5 7 18.6 10.6" stroke="#22C55E" stroke-width="2" stroke-linecap="round" opacity=".72"/>
    <path d="M8.6 14C10.65 12.2 13.35 12.2 15.4 14" stroke="#22C55E" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <circle cx="12" cy="17.2" r="2" fill="#22C55E"/>
  </svg>
</div>
</body>
</html>
